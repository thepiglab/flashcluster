[package]
name = "flashcluster"
version = "0.1.0"
edition = "2021"
description = "Fast k-means / e-means clustering and nearest-neighbour search for embeddings on CPUs (AVX2/AVX-512) and NVIDIA GPUs"
license = "MIT"
publish = false

[[bin]]
name = "flashcluster"
path = "src/main.rs"

[lib]
name = "flashcluster"
path = "src/lib.rs"

[features]
# GPU engine (cuda/flashcluster.cu, nvcc + cuBLAS; CUDA >= 12.8 for Blackwell)
cuda = []

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gemm = { version = "0.19", default-features = false, features = ["std", "rayon", "x86-v4"] }
half = "2"
libc = "0.2"
memmap2 = "0.9"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
